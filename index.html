<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>P2P Escrow Exchange</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111827; /* dark mode */
      color: white;
    }
    .screen { display: none; padding: 20px; }
    .active { display: block; }
    button {
      background-color: #8B5CF6; /* purple accent */
      border: none;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 5px;
      color: white;
      cursor: pointer;
    }
    button.success { background-color: #10B981; } /* neon green */
    .container { display: flex; height: 80vh; }
    .left, .right {
      flex: 1; padding: 20px; border-right: 1px solid #374151;
    }
    .right { border-right: none; }
    #chat { border: 1px solid #374151; height: 200px; overflow-y: auto; padding: 5px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <!-- Landing/Auth -->
  <div id="landing" class="screen active" style="text-align:center; margin-top:15%;">
    <h1>Game Asset Escrow</h1>
    <button onclick="goTo('dashboard')">Sign in with Google</button>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="screen">
    <h2>Welcome, Gamer</h2>
    <button onclick="createRoom()">Create Trade Room</button>
    <button onclick="joinRoom()">Join Trade Room</button>
  </div>

  <!-- Trade Room -->
  <div id="trade" class="screen">
    <h2>Escrow Trade Room</h2>
    <div class="container">
      <div class="left">
        <h3>Trade Status</h3>
        <div id="phase">Phase 1: Payment Escrow</div>
        <button onclick="depositFunds()">Deposit Funds</button>
        <button onclick="releaseFunds()">Verify & Release</button>
        <button onclick="reportIssue()">Report Issue / Cancel Trade</button>
      </div>
      <div class="right">
        <h3>Chat</h3>
        <div id="chat"></div>
        <input id="msg" placeholder="Type message...">
        <button onclick="sendMessage()">Send</button>

        <h3>Credentials</h3>
        <input type="password" id="cred" placeholder="Enter PUBG ID/Pass">
        <button onclick="toggleMask()">Mask/Unmask</button>
      </div>
    </div>
  </div>

<script>
  let phase = 1;

  function goTo(screen) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screen).classList.add('active');
  }

  function createRoom() {
    alert("Room created! ID: 123456");
    goTo('trade');
  }

  function joinRoom() {
    let code = prompt("Enter Room ID:");
    if (code) goTo('trade');
  }

  function depositFunds() {
    phase = 2;
    document.getElementById("phase").innerText = "Phase 2: Asset Delivery";
  }

  function releaseFunds() {
    phase = 4;
    document.getElementById("phase").innerText = "Phase 4: Completed - Funds Released";
  }

  function reportIssue() {
    alert("Trade reported/cancelled. Admin notified.");
    document.getElementById("phase").innerText = "Trade Cancelled / Frozen";
  }

  function sendMessage() {
    let msg = document.getElementById("msg").value;
    if (msg.trim() !== "") {
      let chat = document.getElementById("chat");
      chat.innerHTML += "<div>" + msg + "</div>";
      document.getElementById("msg").value = "";
    }
  }

  function toggleMask() {
    let cred = document.getElementById("cred");
    cred.type = cred.type === "password" ? "text" : "password";
  }
</script>

</body>
</html>
